# ============================================================
# .github/workflows/deploy.yml
# Билдва Next.js сайта и го деплойва на GitHub Pages (gh-pages).
# ПОПРАВЕНА версия: само деплой, БЕЗ стария agents блок,
# който причиняваше порой от провали.
# ============================================================
name: Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права за деплой на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Само един деплой наведнъж (без блъскане → без порой грешки)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://aipickspro.com

      - name: Add CNAME (custom domain)
        run: echo "aipickspro.com" > out/CNAME

      - name: Add .nojekyll (Next.js needs this on Pages)
        run: touch out/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
